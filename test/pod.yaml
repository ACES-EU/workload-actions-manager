---
apiVersion: v1
kind: Binding
metadata:
  name: test-ffd4df46f-h7z5z  # Must match the Pod name
target:
  apiVersion: v1
  kind: Node
  name: k3d-aces-agent-7  # Replace with your node's name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  labels:
    app: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      schedulerName: "wam-scheduler"
      containers:
        - name: test
          image: gcr.io/google_containers/pause
