apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "test-c.fullname" . }}
  labels:
    {{- include "test-c.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "test-c.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "test-c.selectorLabels" . | nindent 8 }}
    spec:
      schedulerName: "wam-scheduler" # or some other scheduler
      containers:
        - name: test
          image: registry.k8s.io/busybox:1.27.2
          args:
            - /bin/sh
            - -c
            - sleep $((RANDOM % 16)); touch /tmp/ready; tail -f /dev/null
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/ready
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
