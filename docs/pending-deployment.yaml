---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-test
  namespace: ul
  labels:
    app: pending-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pending-test
  template:
    metadata:
      labels:
        app: pending-test
    spec:
      schedulerName: "wam-scheduler" # or some other scheduler
      containers:
        - name: example-container
          image: gcr.io/google_containers/pause
          resources:
            requests:
              cpu: "1m"
              memory: "128Mi"
            limits:
              cpu: "20m"
