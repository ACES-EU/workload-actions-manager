---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduled-test
  namespace: ul
  labels:
    app: scheduled-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduled-test
  template:
    metadata:
      labels:
        app: scheduled-test
    spec:
      containers:
        - name: example-container
          image: gcr.io/google_containers/pause
          resources:
            requests:
              cpu: "1m"
              memory: "128Mi"
            limits:
              cpu: "20m"
